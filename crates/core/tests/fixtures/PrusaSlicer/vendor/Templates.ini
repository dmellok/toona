# Generic filament profile templates: a hand-made stand-in, as PrusaResearch.ini is.

[vendor]
repo_id = non-prusa-fff
name = Templates
config_version = 2.0.1
templates_profile = 1

[filament:*common*]
cooling = 1
compatible_printers = 
compatible_printers_condition = printer_notes!~/.*NO_TEMPLATES.*/ and ! (printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and num_extruders>1)
extrusion_multiplier = 1
filament_density = 0
filament_diameter = 1.75
filament_max_volumetric_speed = 0
filament_notes = ""

[filament:*PLA*]
inherits = *common*
bed_temperature = 55
filament_colour = #FF8000
filament_type = PLA
first_layer_bed_temperature = 55
first_layer_temperature = 205
temperature = 205

[filament:*ABS*]
inherits = *common*
bed_temperature = 100
filament_colour = #FFF2EC
filament_type = ABS
first_layer_bed_temperature = 100
first_layer_temperature = 255
temperature = 255

[filament:Generic PLA]
inherits = *PLA*
filament_vendor = Generic
filament_density = 1.24

[filament:Generic ABS]
inherits = *ABS*
filament_vendor = Generic
filament_density = 1.04
