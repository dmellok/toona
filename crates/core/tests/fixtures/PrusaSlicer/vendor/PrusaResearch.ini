# A hand-made stand-in for PrusaSlicer's own bundle: the same structure, a handful of
# presets, and values written for these tests rather than copied from Prusa's.

[vendor]
repo_id = prusa-fff
name = Prusa Research
config_version = 2.5.16

[printer_model:MK4S]
name = Original Prusa MK4S
variants = HF0.4; 0.4
technology = FFF
family = MK4

[printer_model:MK3S]
name = Original Prusa i3 MK3S && MK3S+
variants = 0.4; 0.25; 0.6; 0.8
technology = FFF
family = MK3

[printer_model:SL1]
name = Original Prusa SL1
variants = default
technology = SLA

[print:*common*]
layer_height = 0.2

[filament:*common*]
cooling = 1
compatible_printers = 
compatible_printers_condition = ! (printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and printer_notes=~/.*PRINTER_MODEL_MK(2.5|3).*/ and single_extruder_multi_material) and printer_notes!~/.*PG.*/
end_filament_gcode = "; Filament-specific end gcode"
extrusion_multiplier = 1
filament_cost = 0
filament_density = 0
filament_diameter = 1.75
filament_max_volumetric_speed = 0
filament_notes = ""
filament_settings_id = ""
min_print_speed = 15
start_filament_gcode = "M900 K{if printer_notes=~/.*PRINTER_MODEL_MINI.*/}0.2{else}30{endif} ; Filament gcode"

[filament:*PLA*]
inherits = *common*
bed_temperature = 60
filament_colour = #FF8000
filament_max_volumetric_speed = 15
filament_type = PLA
first_layer_bed_temperature = 60
first_layer_temperature = 215
max_fan_speed = 100
min_fan_speed = 100
temperature = 210

[filament:*PLAPG*]
start_filament_gcode = "M572 S{if nozzle_diameter[filament_extruder_id]==0.4}0.036{else}0{endif} ; Pressure advance\nM142 S36 ; set heatbreak target temp"
compatible_printers_condition = printer_model=~/(MK4S|MK4SMMU3)/ and nozzle_diameter[0]!=0.8 and ! nozzle_high_flow[0]
filament_max_volumetric_speed = 12

[filament:*PLAHF*]
compatible_printers_condition = printer_model=~/(MK4S|MK4SMMU3)/ and nozzle_diameter[0]==0.4 and nozzle_high_flow[0]
filament_max_volumetric_speed = 24

[filament:*PET*]
inherits = *common*
bed_temperature = 85
filament_colour = #FF8000
filament_max_volumetric_speed = 8
filament_type = PETG
first_layer_bed_temperature = 85
first_layer_temperature = 230
max_fan_speed = 50
min_fan_speed = 30
temperature = 240

[filament:Generic PLA]
inherits = *PLA*
filament_vendor = Generic
filament_cost = 25.4
filament_density = 1.24
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_notes!~/.*PG.*/ and ! (printer_notes=~/.*PRINTER_VENDOR_PRUSA3D.*/ and printer_notes=~/.*PRINTER_MODEL_MK(2.5|3).*/ and single_extruder_multi_material)

[filament:Generic PLA @MK4S]
inherits = Generic PLA; *PLAPG*

[filament:Generic PLA @MK4S HF0.4]
inherits = Generic PLA; *PLAPG*; *PLAHF*

[filament:Generic PETG]
inherits = *PET*
filament_vendor = Generic
filament_density = 1.27
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_notes!~/.*PG.*/

[filament:Prusament PLA]
inherits = *PLA*
filament_vendor = Prusa Polymers
temperature = 215
filament_density = 1.24
compatible_printers_condition = nozzle_diameter[0]!=0.8 and printer_notes!~/.*PG.*/

[filament:Only For One Printer]
inherits = *PLA*
filament_vendor = Generic
compatible_printers = "Original Prusa i3 MK3S & MK3S+ 0.6 nozzle"
compatible_printers_condition = 

[sla_material:*common*]
compatible_printers_condition = printer_notes=~/.*PRINTER_MODEL_SL1.*/

[printer:*common*]
printer_technology = FFF
nozzle_diameter = 0.4
printer_variant = 0.4
printer_notes = Don't remove the following keywords!\nPRINTER_VENDOR_PRUSA3D\n
single_extruder_multi_material = 0

[printer:Original Prusa i3 MK3]
inherits = *common*
printer_model = MK3
printer_notes = Don't remove the following keywords!\nPRINTER_VENDOR_PRUSA3D\nPRINTER_MODEL_MK3\n

[printer:Original Prusa i3 MK3 0.6 nozzle]
inherits = Original Prusa i3 MK3
nozzle_diameter = 0.6
printer_variant = 0.6

[printer:Original Prusa i3 MK3S & MK3S+]
inherits = Original Prusa i3 MK3
printer_model = MK3S

[printer:Original Prusa i3 MK3S & MK3S+ 0.6 nozzle]
inherits = Original Prusa i3 MK3 0.6 nozzle
printer_model = MK3S

[printer:Original Prusa i3 MK3S & MK3S+ 0.8 nozzle]
inherits = Original Prusa i3 MK3S & MK3S+
nozzle_diameter = 0.8
printer_variant = 0.8

[printer:Original Prusa MK4S 0.4 nozzle]
inherits = *common*
printer_model = MK4S
printer_notes = Don't remove the following keywords!\nPRINTER_VENDOR_PRUSA3D\nPRINTER_MODEL_MK4S\nPG\n

[printer:Original Prusa MK4S HF0.4 nozzle]
inherits = Original Prusa MK4S 0.4 nozzle
printer_variant = HF0.4
nozzle_high_flow = 1

[printer:Original Prusa SL1]
printer_technology = SLA
printer_model = SL1
printer_variant = default
