[package]
name = "toona-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Toona desktop app"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name (needed on Windows).
name = "toona_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "toona-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
directories = "6.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
toona-core = { path = "../../crates/core" }
